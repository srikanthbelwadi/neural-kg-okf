apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: neural-kg-engine
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/neural-kg/engine:latest
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: LLM_PROVIDER
              value: "gemini"
            - name: CHAT_MODEL
              value: "gemini-2.0-flash"
            - name: EMBED_MODEL
              value: "gemini-embedding-001"
            - name: BIGQUERY_LOCATION
              value: "US"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: GOOGLE_CLOUD_PROJECT
              value: "YOUR_PROJECT_ID"
